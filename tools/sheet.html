<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#241b3c;font:12px monospace;color:#eee}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:10px}
.cell{background:#1b1430;border:1px solid #4a3a75;border-radius:8px;padding:6px;text-align:center}
canvas{image-rendering:pixelated;display:block;margin:0 auto}
</style></head><body><div class="grid" id="g"></div>
<script src="../js/art.js"></script>
<script>
ART.init();
const g=document.getElementById('g');
const keys=Object.keys(ART.DEFS);
for(const k of keys){
  const d=document.createElement('div'); d.className='cell';
  const c=document.createElement('canvas'); c.width=128; c.height=128;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  x.drawImage(ART.sprite(k),0,0,128,128);
  d.appendChild(c);
  const l=document.createElement('div'); l.textContent=k; d.appendChild(l);
  g.appendChild(d);
}
</script></body></html>
